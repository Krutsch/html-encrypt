<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Demo html-encrypt</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        background-color: #c0ffee;
      }
      h1 {
        text-align: center;
      }
      img {
        display: block;
        margin: auto;
        max-height: 50vh;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <script type="module">
      const esm = ({ raw }, ...vals) =>
        URL.createObjectURL(
          new Blob([String.raw({ raw }, ...vals)], {
            type: "application/javascript",
          }),
        );
      const { handleDecryptionOfPage } =
        await import(esm`const{subtle:i}=crypto,d={1:1e3,2:14e3,3:585e3},w="SHA-256",p=4;export const IV_BITS=128,ENCRYPTION_ALGO="AES-CBC",HexEncoder={parse(t){if(t.length%2!==0)throw"Invalid hexString";const n=new Uint8Array(t.length/2);for(let e=0;e<t.length;e+=2){const r=parseInt(t.substring(e,e+2),16);if(isNaN(r))throw"Invalid hexString";n[e/2]=r}return n},stringify(t){return Array.from(t,n=>n.toString(16).padStart(2,"0")).join("")}};async function h(t,n){const e=IV_BITS/p,r=HexEncoder.parse(t.substring(0,e)),s=t.substring(e),a=await i.importKey("raw",HexEncoder.parse(n),ENCRYPTION_ALGO,!1,["decrypt"]),o=await i.decrypt({name:ENCRYPTION_ALGO,iv:r},a,HexEncoder.parse(s));return new TextDecoder().decode(new Uint8Array(o))}async function m(t,n,e,r){const s=await i.importKey("raw",new TextEncoder().encode(t),"PBKDF2",!1,["deriveBits"]),a=await i.deriveBits({name:"PBKDF2",hash:r,iterations:e,salt:new TextEncoder().encode(n)},s,256);return HexEncoder.stringify(new Uint8Array(a))}async function u(t,n,e,r=w){return m(t,n,e,r)}async function y(t,n,e,r=0,s=""){const a=t.substring(0,64),o=t.substring(64);if(await signMessage(n,o)!==a){if(s||=n,r===0){const c=await u(s,e,d[3]);return y(t,c,e,1,s)}if(r===1){let c=await u(s,e,d[2]);return c=await u(c,e,d[3]),y(t,c,e,2,s)}return{success:!1,message:"Signature mismatch"}}return{success:!0,decoded:await h(o,n)}}export async function handleDecryptionOfPage(t,n,e){const r=await hashPassword(t,e),s=await y(n,r,e);if(!s.success)return!1;try{const{render:a,html:o,setReuseElements:f}=await import("https://cdn.jsdelivr.net/npm/hydro-js");f(!1);const c=o({raw:s.decoded});a(c.querySelector("html")||c,document.documentElement)}catch{document.write(s.decoded),document.close()}return!0}export async function hashPassword(t,n){let e=await u(t,n,d[1],"SHA-1");return e=await u(e,n,d[2]),u(e,n,d[3])}export async function signMessage(t,n){const e=await i.importKey("raw",HexEncoder.parse(t),{name:"HMAC",hash:w},!1,["sign"]),r=await i.sign("HMAC",e,new TextEncoder().encode(n));return HexEncoder.stringify(new Uint8Array(r))}
`);
      const encryptedMsg =
        "e8296ff4365888c79852de745f974ad984989c3dccc0eff005ea9ef13af9012e9a37b69039cf72da57f6a7bd545e4157f9756812c1e6b007068f57e7c5d34289c0e45fc10587158697779587f2c302d6e99c8bd4bd077c3d3f849f9343cf1040fbe07d498758a0031b6795ab2d0d0b09175394191a927fb3c15dd9aeeb67498f8e7202646d4fe3775071d00bdef907c3aff925b998a679d6327eeee0059cd385e91331adade3d29d707706cf59762a6291488642afed696408d6e39180aa34ed5e363e10984c68c501ad3e1d28baa08a8d6f2522c2fc0b188ab5b82c370ebb37a3eb09bc130f1c7081e6326cad048e3158b4dc967058ad8d03c760ffe97e2987fab4cbe329d9fc4b28b7472b389c795af79983e2909b10a28e755271205abe3609431002af225b53843a9b0135d62d80c787bc42f9aa666fae3c96267403c6370d522a705a866b4335248bcec246591a33e5006ad8050da6de5427f3257b27326c2a4058953cdd55b5b83c015b52d97d9751f49d2a63097a12034bf2e28f24b780e39de127a08b6508dc640995e1220ee1343ece44ade1432801bfe6ca815d0b5ab74f320a0a73823150ecbbaed8a533c5c3e39ea2520f426e9a36e693130ff12892ec6fcabf47caa01d9d4c9ead83a0efe4862d70b3d236de555aa3221cb6b91725013d6ed3934b62ca3198595b3ae884d3eded5b27eb71f94d1c82981b3eb29cf97aa5208a8419fbde5d99b95a4046a349cf7835042c19b878c71c5fc5a75be5beaba3d15ddc9e9cf244420d4e6f0aa70034df31cdb890d72ab3f4aaa16cba8ef8cd8f479a62f8276c04219a7f7da28d5d2fd2de424c50e6948a30eef668e59a336acd0ce5e7e87d2c798cbf3be2cd959da1de4d8cd03a1ba1f5024c7cb26051af8f4d80b53beec28b92542f57686f8073daa387c5252806be6d578435fb27b598b8ca450fbd526b026d8acd1b91ae81792f74beaaa0865624c881bee521af21161059a29e49ef32cc1eedee2a043395d6c5e1842077f8da67682f5e66d7300c09f10797427ff8f963783191d0a0f40ccf211abc754518026002fdd1e4e44756bc6c2d7bb6482312367d02ed55ab80deb963a53efc4a033c986b67442395457304fc4f3c368efc121bf6914b74c9be90ee3cb8dcac8aff668b9a7b108bf081285af663eaff0782bdabcba868092b380e5579492170c49c08bbd16b7536e2e848e7dd8ffc660c748e7922e7dc48826dadf6f276e29c0484565955889d6a1e4d6c88b92becfe44d6772fcc551995a7eeb3e7fdd4f109f642b1ef5765f6b14863fdfb929417766bba96db2250fbd34dc0e426517624cc67f5907ba1a29a5dd24925f8a2d01fe7c1915fe3dfd1a741c79e2eb8e8b95348c36787d2d8f9c7addc6fcc9001597ed60954afda3edfdac4001056562367c2d40f6682cf50438eb09076435be55567d6129cb298fa8c619a24a9d7fcce07fdaf01cee156cf3d24c3c846aa68f0df688c382c27a0b1bc9fcb9f182d9216b7c7770939ecc0c982dba4c37d94487379f46b69d07bf4e8ed9b9d1ea15c32f445b629127ff2e089d288539d67";
      const salt = "e5fa1ce8383a004fbe58674c88cce588";
      const main = document.querySelector("main");
      document.querySelector("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = document.querySelector("input").value;
        const isSuccessful = await handleDecryptionOfPage(
          password,
          encryptedMsg,
          salt,
        );
        if (!isSuccessful) {
          main?.classList.remove("shake");
          main?.offsetWidth;
          main?.classList.add("shake");
        }
      });
    </script>
    <style>
      *,
      ::after,
      ::before {
        box-sizing: border-box;
        border-width: 0;
        border-style: solid;
        border-color: #e5e7eb;
      }
      html {
        height: 100%;
        line-height: 1.5;
        overflow: hidden;
      }
      body {
        margin: 0;
        display: block;
        height: 100%;
        width: 100%;
        background-color: rgb(17 24 39) !important;
        color: rgb(241 245 249);
        font-size: 1rem;
        line-height: 1.5rem;
        overflow-x: hidden;
      }
      h1 {
        margin: 0;
        font-size: inherit;
        font-weight: inherit;
      }
      button,
      input {
        margin: 0;
        padding: 0;
        color: inherit;
        font: inherit;
        font-feature-settings: inherit;
        font-variation-settings: inherit;
        letter-spacing: inherit;
        line-height: inherit;
      }
      button {
        text-transform: none;
      }
      @keyframes shake {
        0% {
          transform: translateX(0);
        }
        6.5% {
          transform: translateX(-6px) rotateY(-9deg);
        }
        18.5% {
          transform: translateX(5px) rotateY(7deg);
        }
        31.5% {
          transform: translateX(-3px) rotateY(-5deg);
        }
        43.5% {
          transform: translateX(2px) rotateY(3deg);
        }
        50% {
          transform: translateX(0);
        }
      }
      .shake {
        animation: shake 2s;
      }
      .html-encrypt-login {
        display: flex;
        width: 100%;
        height: 100%;
        place-content: center;
        place-items: center;
      }
      .html-encrypt-card {
        box-sizing: border-box;
        width: 100%;
        max-width: 37rem;
        border-radius: 0.25rem;
        background: #1e293b;
        padding: 2.5rem 1.25rem;
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.1),
          0 8px 10px -6px rgb(0 0 0 / 0.1);
      }
      .html-encrypt-title {
        margin: 0 0 0.5rem;
        font-size: 1.875rem;
        line-height: 2.25rem;
        font-weight: 700;
        text-align: center;
      }
      .html-encrypt-label {
        display: grid;
      }
      .html-encrypt-label-text {
        margin-top: 1rem;
        margin-bottom: 0.375rem;
        color: #cbd5e1;
      }
      .html-encrypt-input {
        box-sizing: border-box;
        width: 100%;
        appearance: none;
        border: 1px solid #94a3b8;
        border-radius: 0.25rem;
        background: #0f172a;
        padding: 0.625rem 0.75rem;
        color: inherit;
      }
      .html-encrypt-input:focus-visible {
        border-color: #0d9488;
        outline: 2px solid transparent;
        box-shadow: 0 0 0 1px #0891b2;
      }
      .html-encrypt-button {
        width: 100%;
        margin-top: 1rem;
        border: 0;
        border-radius: 0.25rem;
        background: #f1f5f9;
        padding: 0.75rem 0;
        color: #1e293b;
        font-weight: 700;
        cursor: pointer;
      }
      .html-encrypt-button:focus-visible {
        outline: 2px solid #22d3ee;
        outline-offset: 2px;
      }
      @media screen and (-webkit-min-device-pixel-ratio: 0) {
        input[type="password"],
        input[type="text"] {
          font-size: 16px;
        }
      }
    </style>
    <script type="module">
      document.querySelector("input").addEventListener("change", () => {
        document.body.querySelector("input:autofill") &&
          document.body.querySelector("button").click();
      });
    </script>
    <main class="html-encrypt-login">
      <div class="html-encrypt-card">
        <h1 class="html-encrypt-title">Password</h1>
        <form>
          <label class="html-encrypt-label"
            ><span class="html-encrypt-label-text"
              >Please enter the password <b>admin</b></span
            >
            <input
              type="password"
              name="password"
              aria-label="Password"
              autocomplete="current-password"
              required
              autofocus
              class="html-encrypt-input"
          /></label>
          <button type="submit" class="html-encrypt-button">Login</button>
        </form>
      </div>
    </main>
    <link
      rel="preload"
      href="https://cdn.jsdelivr.net/npm/hydro-js"
      as="script"
      crossorigin
    />
  </body>
</html>
